<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Good Day — A little inspiration</title>
	<style>
		:root { color-scheme: light; --ink: #18332f; --green: #286b58; --cream: #f5f3eb; }
		* { box-sizing: border-box; }
		body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--cream); }
		header { max-width: 1100px; margin: auto; padding: 24px 7%; display: flex; justify-content: space-between; align-items: center; }
		.brand { color: var(--green); font-size: 1.2rem; font-weight: 800; letter-spacing: -.04em; text-decoration: none; }
		nav { display: flex; gap: 26px; }
		nav a { color: #52645d; text-decoration: none; font-size: .95rem; }
		nav a:hover { color: var(--green); }
		main { min-height: 76vh; display: grid; place-items: center; padding: 56px 7%; }
		.hero { width: min(100%, 900px); padding: clamp(42px, 9vw, 100px); border-radius: 28px; background: #e5eee5; text-align: center; }
		.eyebrow { color: var(--green); font-size: .78rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
		h1 { max-width: 700px; margin: 18px auto; font-size: clamp(2.7rem, 8vw, 5.4rem); line-height: 1.02; letter-spacing: -.065em; }
		.intro { max-width: 520px; margin: 0 auto 30px; color: #52645d; font-size: 1.1rem; line-height: 1.7; }
		.button { display: inline-block; padding: 14px 23px; border-radius: 999px; background: var(--green); color: white; font-weight: 700; text-decoration: none; transition: transform .2s, background .2s; }
		.button:hover { background: #1d5142; transform: translateY(-2px); }
		footer { padding: 20px; color: #718078; text-align: center; font-size: .9rem; }
		@media (max-width: 520px) { header { padding: 20px 6%; } nav { gap: 14px; } nav a { font-size: .85rem; } main { padding: 28px 6%; } .hero { border-radius: 20px; } }
	</style>
</head>
<body>
	<header>
		<a class="brand" href="#home">good day<span aria-hidden="true">.</span></a>
		<nav aria-label="Main navigation">
			<a href="#home">Home</a>
			<a href="#about">About</a>
			<a href="mailto:hello@example.com">Contact</a>
		</nav>
	</header>
	<main id="home">
		<section class="hero" id="about">
			<div class="eyebrow">A little space to breathe</div>
			<h1>Make room for good things.</h1>
			<p class="intro">A simple reminder to slow down, find what inspires you, and take the next small step.</p>
			<a class="button" href="mailto:hello@example.com">Say hello&nbsp; →</a>
		</section>
	</main>
	<footer>Made for brighter days.</footer>
</body>
</html>
